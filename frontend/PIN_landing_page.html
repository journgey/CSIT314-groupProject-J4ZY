<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIN Dashboard</title>
  <link rel="stylesheet" href="static/css/theme.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/layout.css">
</head>
<body>
  <div class="page container">
    <div class="page-header">
      <h2 class="page-title">Welcome to PIN Dashboard</h2>
      <div class="toolbar">
        <button class="btn btn-outline" onclick="window.location.href='PIN_request_history.html'">View Completed Requests</button>
        <button class="btn btn-primary" onclick="window.location.href='PIN_new_request.html'">Add New Request</button>
      </div>
    </div>

    <section class="content card">
      <h3>Account Overview</h3>
      <p>Total Active Requests: <span id="activeCount">0</span></p>
      <p>Total Completed Requests: <span id="completedCount">0</span></p>
    </section>

    <section class="content card">
      <h3>Active Requests</h3>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="requestTable"></tbody>
      </table>
    </section>
  </div>

  <script src="mock_requests.js"></script>
  <script>
    const mockRequests = window.mockRequests;

    function loadDashboard() {
      const active = mockRequests.filter(r => r.status !== "completed");
      const completed = mockRequests.filter(r => r.status === "completed");

      document.getElementById("activeCount").textContent = active.length;
      document.getElementById("completedCount").textContent = completed.length;

      const table = document.getElementById("requestTable");
      table.innerHTML = "";

      active.forEach(r => {
        const row = `
          <tr>
            <td>${r.id}</td>
            <td><a href="PIN_view_request.html?id=${r.id}">${r.title}</a></td>
            <td>${r.category}</td>
            <td>${r.status}</td>
            <td>${r.date}</td>
            <td>
              <button class="btn btn-primary" onclick="window.location.href='PIN_edit_request.html?id=${r.id}'">Edit/Delete</button>
            </td>
          </tr>
        `;
        table.insertAdjacentHTML("beforeend", row);
      });
    }

    document.addEventListener("DOMContentLoaded", loadDashboard);
  </script>
</body>
</html>
