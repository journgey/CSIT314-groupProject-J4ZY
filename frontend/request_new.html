<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New Request</title>

  <!-- Project style sheets -->
  <link rel="stylesheet" href="static/css/theme.css" />
  <link rel="stylesheet" href="static/css/base.css" />
  <link rel="stylesheet" href="static/css/layout.css" />
</head>
<body>
  <!-- Optional: top navigation bar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="accounts.html">Accounts</a>
      <a href="requests.html" aria-current="page">Requests</a>
      <a href="categories.html">Categories</a>
    </div>
  </nav>

  <main class="container page">
    <header class="page-header">
      <h2 class="page-title">Create Request</h2>
      <div class="toolbar"><a href="requests.html" class="btn btn-outline">← Back</a></div>
    </header>

    <section class="card content">
      <form id="frm" class="content">
        <!-- PIN Account -->
        <div class="input-group">
          <label for="pin_account_id">PIN Account</label>
          <select id="pin_account_id" required></select>
        </div>

        <!-- Category -->
        <div class="input-group">
          <label for="category_id">Category</label>
          <select id="category_id"><option value="">(None)</option></select>
        </div>

        <!-- Postal / Address (new) -->
        <div class="input-group">
          <label for="postal_code">Postal Code</label>
          <div style="display:flex; gap:8px;">
            <input id="postal_code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="e.g., 238801" />
            <button id="btn_lookup" class="btn btn-outline" type="button">Lookup</button>
          </div>
        </div>
        <div class="input-group">
          <label for="address">Address</label>
          <input id="address" readonly placeholder="Auto-filled from postal code" />
        </div>

        <!-- Region / District (new) -->
        <div class="input-group">
          <label for="region_id">Region</label>
          <select id="region_id"><option value="">(Auto)</option></select>
        </div>
        <div class="input-group">
          <label for="district_id">District</label>
          <select id="district_id" required><option value="">(Select)</option></select>
        </div>

        <!-- Title / Description / Status (기존) -->
        <div class="input-group">
          <label for="title">Title</label>
          <input id="title" required />
        </div>
        <div class="input-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4"></textarea>
        </div>
        <div class="input-group">
          <label for="status">Status</label>
          <select id="status">
            <option>OPEN</option>
            <option>IN_PROGRESS</option>
            <option>CLOSED</option>
          </select>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Create</button>
          <a class="btn btn-outline" href="requests.html">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script src="static/js/api.js"></script>
  <script>
    // --- helpers ---
    async function loadRegions(selectedId = null) {
      const regions = await apiGet('/addresses/regions');
      const sel = document.getElementById('region_id');
      sel.innerHTML = '<option value="">(Auto)</option>' + regions.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
      if (selectedId) sel.value = String(selectedId);
    }
    async function loadDistricts(regionId = null, selectedId = null) {
      const qs = regionId ? `?region_id=${regionId}` : '';
      const districts = await apiGet('/addresses/districts' + qs);
      const sel = document.getElementById('district_id');
      sel.innerHTML = '<option value="">(Select)</option>' + districts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      if (selectedId) sel.value = String(selectedId);
    }

    async function doLookup() {
      const postal = document.getElementById('postal_code').value.trim();
      if (!postal) return;
      const res = await apiJson('/addresses/lookup', 'POST', { postal_code: postal });
      document.getElementById('address').value = res.address || '';
      // Region/District 자동 선택
      await loadRegions(res.region_id || null);
      await loadDistricts(res.region_id || null, res.district_id || null);
      if (res.region_id) document.getElementById('region_id').value = String(res.region_id);
      if (res.district_id) document.getElementById('district_id').value = String(res.district_id);
    }

    // --- events ---
    document.getElementById('btn_lookup').addEventListener('click', doLookup);
    document.getElementById('region_id').addEventListener('change', async (e) => {
      const rid = e.target.value ? Number(e.target.value) : null;
      await loadDistricts(rid, null);
    });

    // --- initial loads ---
    async function loadRefs() {
      const [accounts, categories] = await Promise.all([ apiGet('/accounts/'), apiGet('/categories/') ]);
      document.getElementById('pin_account_id').innerHTML =
        accounts.map(a => `<option value="${a.id}">${a.email} (${a.role})</option>`).join('');
      document.getElementById('category_id').innerHTML +=
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      await loadRegions(null);
      await loadDistricts(null);
    }

    // submit
    document.getElementById('frm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dto = {
        pin_id: Number(document.getElementById('pin_account_id').value),
        category_id: document.getElementById('category_id').value ? Number(document.getElementById('category_id').value) : null,
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        status: document.getElementById('status').value,
        postal_code: document.getElementById('postal_code').value.trim() || null,
        address: document.getElementById('address').value || null,
        region_id: document.getElementById('region_id').value ? Number(document.getElementById('region_id').value) : null,
        district_id: document.getElementById('district_id').value ? Number(document.getElementById('district_id').value) : null
      };
      await apiJson('/requests/', 'POST', dto);
      location.href = 'requests.html';
    });

    loadRefs();
  </script>
</body>
</html>
