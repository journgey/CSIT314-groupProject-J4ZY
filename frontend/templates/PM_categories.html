<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Platform Manager – Manage Categories</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <style>
    /* Layout */
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    .form-inline { display:flex; gap:8px; flex-wrap:wrap; }
    .w-200 { width:200px; }
    .mt-2 { margin-top:.5rem; } .mt-3 { margin-top:1rem; } .mt-4 { margin-top:1.5rem; }
    .btn-sm { padding:4px 8px; font-size:.9rem; }

    /* Modal base */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
             justify-content:center; align-items:center; z-index:999; }
    .modal.open { display:flex; }
    .modal-card { background:#fff; color:var(--color-text,#222); border-radius:10px; padding:18px 20px; width: min(520px, 92vw); box-shadow:0 10px 28px rgba(0,0,0,.18); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .modal-title { font-size:1.1rem; font-weight:700; }
    .modal-body { margin-top:10px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .danger { color:#a50017; }

    /* Small helpers */
    .row-name { max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
<main class="container page">
  <div class="page-header">
    <h2 class="page-title">Manage Category</h2>
    <button id="logoutBtn" class="btn btn-outline">Logout</button>
    <div class="toolbar">
      <a class="btn btn-outline" href="/pm">← Back to Dashboard</a>
    </div>
  </div>

  <div id="flash" class="muted"></div>

  <section class="card content">
    <h3>Create New</h3>
    <form id="createForm" class="form-inline" novalidate>
      <input id="newName" class="input w-200" placeholder="Category name" required />
      <button class="btn btn-primary" id="createBtn" type="submit">Create</button>
    </form>

    <h3 class="mt-4">All Categories</h3>
    <table class="table" id="tbl">
      <thead>
      <tr>
        <th style="width:80px;">ID</th>
        <th>Name</th>
        <th style="width:220px;">Action</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<!-- Edit Modal -->
<div id="editModal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-header">
      <div class="modal-title" id="editTitle">Edit Category</div>
      <button type="button" class="btn btn-outline btn-sm" data-close="edit">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="editName">Name</label>
        <input id="editName" class="input" />
        <input id="editId" type="hidden" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-close="edit">Cancel</button>
      <button class="btn btn-primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <div class="modal-header">
      <div class="modal-title danger" id="delTitle">Delete Category</div>
      <button type="button" class="btn btn-outline btn-sm" data-close="delete">✕</button>
    </div>
    <div class="modal-body">
      <p id="delMsg">Are you sure you want to delete this category?</p>
      <input id="delId" type="hidden" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-close="delete">Cancel</button>
      <button class="btn btn-danger" id="deleteOkBtn">Delete</button>
    </div>
  </div>
</div>

<script>
/* ==============================
   HTTP utilities (JSON + cookies)
   ============================== */
async function apiFetch(url, opts = {}) {
  const res = await fetch(url, { credentials: "include", ...opts });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const text = await res.text();
      try { const j = JSON.parse(text); msg = j?.error || j?.message || msg; }
      catch { msg = text || msg; }
    } catch {}
    throw new Error(`${url} → ${msg}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
const http = {
  get: (u) => apiFetch(u),
  post: (u, b) => apiFetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b ?? {}) }),
  put: (u, b) => apiFetch(u, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b ?? {}) }),
  del: (u) => apiFetch(u, { method: "DELETE" }),
};

/* ==============================
   Small helpers
   ============================== */
const $ = (s, r=document) => r.querySelector(s);
function setFlash(t){ const el=$("#flash"); if(el) el.textContent=t||""; }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

/* ==============================
   Auth guard (PlatformManager)
   ============================== */
function normalizeRole(r){
  const x=String(r||"").trim().toLowerCase();
  if(!x) return "";
  if(["useradmin","ua","user_admin"].includes(x)) return "UserAdmin";
  if(["platformmanager","pm","platform_manager"].includes(x)) return "PlatformManager";
  if(x==="pin") return "PIN";
  if(x==="csr") return "CSR";
  return r;
}
async function installAuthGuard(requiredRole=null){
  try{
    const me = await http.get("/api/auth/me");
    const role = normalizeRole(me?.role);
    if(!role) return location.replace("/");
    if(requiredRole && role!==requiredRole) return location.replace("/");
  }catch{ location.replace("/"); }
}
async function doLogout(){ try{ await http.post("/api/auth/logout",{});} finally{ location.replace("/"); }}

/* ==============================
   Categories API
   ============================== */
const categoriesApi = {
  list: () => http.get("/api/category/").then(x=>Array.isArray(x)?x:(x?.items??[])),
  create: (p) => http.post("/api/category/", p),
  update: (id,p) => http.put(`/api/category/${encodeURIComponent(id)}`, p),
  remove: (id) => http.del(`/api/category/${encodeURIComponent(id)}`),
  get: (id) => http.get(`/api/category/${encodeURIComponent(id)}`)
};

/* ==============================
   Modal helpers
   ============================== */
function openModal(id){ const m=$(id); if(m){ m.classList.add("open"); m.setAttribute("aria-hidden","false"); } }
function closeModal(id){ const m=$(id); if(m){ m.classList.remove("open"); m.setAttribute("aria-hidden","true"); } }

/* ==============================
   Rows rendering
   ============================== */
function rowHTML(c){
  const id = c.id;
  const name = escapeHtml(c.name || "");
  return `
    <tr data-id="${id}">
      <td>${id}</td>
      <td class="row-name" title="${name}">${name}</td>
      <td>
        <button class="btn btn-primary btn-sm" data-action="edit" data-id="${id}">Edit</button>
        <button class="btn btn-danger  btn-sm" data-action="delete" data-id="${id}">Delete</button>
      </td>
    </tr>`;
}

/* ==============================
   Page wiring
   ============================== */
document.addEventListener("DOMContentLoaded", async () => {
  await installAuthGuard("PlatformManager");
  $("#logoutBtn")?.addEventListener("click", doLogout);

  const tbody = $("#tbl tbody");
  const createForm = $("#createForm");
  const createBtn  = $("#createBtn");
  const newName    = $("#newName");

  // Load list
  async function render(){
    setFlash("Loading...");
    try{
      const items = await categoriesApi.list();
      tbody.innerHTML = (items||[]).map(rowHTML).join("");
      setFlash("");
    }catch(e){ console.error(e); setFlash("Failed to load categories."); }
  }

  // Create
  createForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const name = (newName.value||"").trim();
    if(!name){ setFlash("Please enter category name."); return; }
    try{
      createBtn.disabled = true; setFlash("Creating...");
      await categoriesApi.create({ name });
      newName.value = "";
      await render();
    }catch(err){ console.error(err); setFlash(err?.message||"Create failed."); }
    finally{ createBtn.disabled = false; }
  });

  // Delegation: Edit/Delete
  tbody.addEventListener("click", async (e)=>{
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const id = Number(btn.getAttribute("data-id"));
    if(!Number.isInteger(id)) return;

    // --- Edit flow with modal ---
    if(btn.dataset.action === "edit"){
      try{
        setFlash("");
        const row = btn.closest("tr");
        const currentName = row?.querySelector(".row-name")?.textContent?.trim() ?? "";
        $("#editId").value = String(id);
        $("#editName").value = currentName;
        openModal("#editModal");
      }catch(err){ console.error(err); setFlash("Failed to open edit dialog."); }
      return;
    }

    // --- Delete flow with confirm modal ---
    if(btn.dataset.action === "delete"){
      $("#delId").value = String(id);
      $("#delMsg").textContent = `Are you sure you want to delete category #${id}? This action cannot be undone.`;
      openModal("#deleteModal");
      return;
    }
  });

  // Edit modal: close buttons
  document.body.addEventListener("click", (e)=>{
    const closeBtn = e.target.closest("[data-close='edit']");
    if(closeBtn) closeModal("#editModal");
    const closeBtn2 = e.target.closest("[data-close='delete']");
    if(closeBtn2) closeModal("#deleteModal");
  });

  // Edit modal: save
  $("#editSaveBtn").addEventListener("click", async ()=>{
    const id  = Number($("#editId").value);
    const name = ($("#editName").value || "").trim();
    if(!name){ setFlash("Name cannot be empty."); return; }
    try{
      $("#editSaveBtn").disabled = true; setFlash(`Saving #${id}...`);
      await categoriesApi.update(id, { name });
      closeModal("#editModal");
      await render();
      setFlash("Saved.");
    }catch(err){ console.error(err); setFlash(err?.message||"Save failed."); }
    finally{ $("#editSaveBtn").disabled = false; }
  });

  // Delete modal: confirm
  $("#deleteOkBtn").addEventListener("click", async ()=>{
    const id = Number($("#delId").value);
    try{
      $("#deleteOkBtn").disabled = true; setFlash(`Deleting #${id}...`);
      await categoriesApi.remove(id);
      closeModal("#deleteModal");
      document.querySelector(`tr[data-id="${id}"]`)?.remove();
      setFlash("Deleted.");
    }catch(err){ console.error(err); setFlash(err?.message||"Delete failed."); }
    finally{ $("#deleteOkBtn").disabled = false; }
  });

  await render();
});
</script>
</body>
</html>
