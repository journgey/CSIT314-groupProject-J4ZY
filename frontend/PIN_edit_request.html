<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Request</title>
  <link rel="stylesheet" href="static/css/theme.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/layout.css">
  <style>
    /* Delete modal styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--color-surface);
      padding: 20px;
      border-radius: var(--radius-lg);
      text-align: center;
      width: 320px;
    }
    .modal-buttons {
      margin-top: 15px;
      display: flex;
      justify-content: space-around;
    }
    .modal-buttons button {
      padding: 6px 16px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .modal-buttons .confirm {
      background-color: var(--color-danger);
      color: white;
    }
    .modal-buttons .cancel {
      background-color: var(--color-muted);
      color: white;
    }
  </style>
</head>
<body>
  <div class="page container">
    <div class="page-header">
      <h2 class="page-title">Edit Request</h2>
    </div>

    <section class="content card">
      <form id="editRequestForm" class="input-group">
        <label>Request title:</label>
        <input type="text" id="title" class="input">

        <label>Service type:</label>
        <select id="category" class="input">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Medical">Medical</option>
          <option value="Other">Other</option>
        </select>

        <label>Date needed:</label>
        <input type="text" id="date" class="input">

        <label>Status:</label>
        <span id="status" class="input readonly-field"></span>

        <label>Description:</label>
        <textarea id="desc" class="input"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" id="deleteBtn" class="btn btn-danger">Delete</button>
          <button type="button" class="btn btn-outline" onclick="window.location.href='PIN_landing_page.html'">← Back to Dashboard</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <p>Are you sure you want to delete this request?</p>
      <div class="modal-buttons">
        <button class="confirm" id="confirmDelete">Yes, delete</button>
        <button class="cancel" id="cancelDelete">Cancel</button>
      </div>
    </div>
  </div>

  <script src="mock_requests.js"></script>
  <script>
    const mockRequests = window.mockRequests;

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const requestId = parseInt(params.get("id"));
      const req = mockRequests.find(r => r.id === requestId);

      if (!req) {
        alert("Request not found (mock). Returning to dashboard...");
        window.location.href = "PIN_landing_page.html";
        return;
      }

      // Populate fields
      document.getElementById("title").value = req.title;
      document.getElementById("category").value = req.category;
      document.getElementById("date").value = req.date;
      document.getElementById("status").textContent = req.status;
      document.getElementById("desc").value = req.desc;

      // Save changes
      document.getElementById("editRequestForm").addEventListener("submit", (e) => {
        e.preventDefault();
        req.title = document.getElementById("title").value;
        req.category = document.getElementById("category").value;
        req.date = document.getElementById("date").value;
        req.desc = document.getElementById("desc").value;

        alert("Changes saved (mock). Redirecting to dashboard...");
        window.location.href = "PIN_landing_page.html";
      });

      // Delete modal logic
      const modal = document.getElementById("deleteModal");
      const deleteBtn = document.getElementById("deleteBtn");
      const confirmDelete = document.getElementById("confirmDelete");
      const cancelDelete = document.getElementById("cancelDelete");

      deleteBtn.addEventListener("click", () => { modal.style.display = "flex"; });
      cancelDelete.addEventListener("click", () => { modal.style.display = "none"; });
      confirmDelete.addEventListener("click", () => {
        const index = mockRequests.findIndex(r => r.id === requestId);
        if (index !== -1) mockRequests.splice(index, 1);
        alert("Request deleted (mock). Redirecting to dashboard...");
        window.location.href = "PIN_landing_page.html";
      });
      window.addEventListener("click", (event) => { if (event.target === modal) modal.style.display = "none"; });
    });
  </script>
</body>
</html>
