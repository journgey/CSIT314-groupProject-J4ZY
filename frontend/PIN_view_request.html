<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Request</title>
  <link rel="stylesheet" href="static/css/theme.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/layout.css">
</head>
<body>
  <div class="page container">
    <div class="page-header">
      <h2 class="page-title">Request Details</h2>
      <div class="toolbar">
        <button class="btn btn-outline" onclick="window.location.href='PIN_landing_page.html'">← Back to Dashboard</button>
      </div>
    </div>

    <section class="content card">
      <form class="input-group">
        <label>Request title:</label>
        <input type="text" id="title" readonly class="input">

        <label>Service type:</label>
        <input type="text" id="category" readonly class="input">

        <label>Date needed:</label>
        <input type="text" id="date" readonly class="input">

        <label>Status:</label>
        <input type="text" id="status" readonly class="input">

        <label>Description:</label>
        <textarea id="desc" readonly class="input"></textarea>
      </form>
    </section>
  </div>

  <script src="mock_requests.js"></script>
  <script>
    const mockRequests = window.mockRequests;

    function loadRequest() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"));
      const req = mockRequests.find(r => r.id === id);
      if (!req) {
        alert("Request not found (mock). Returning to dashboard...");
        window.location.href = "PIN_landing_page.html";
        return;
      }
      document.getElementById("title").value = req.title;
      document.getElementById("category").value = req.category;
      document.getElementById("date").value = req.date;
      document.getElementById("status").value = req.status;
      document.getElementById("desc").value = req.desc;
    }

    document.addEventListener("DOMContentLoaded", loadRequest);
  </script>
</body>
</html>
